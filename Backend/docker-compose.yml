version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventpass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventpass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - eventpass_pgdata:/var/lib/postgresql/data

volumes:
  eventpass_pgdata: